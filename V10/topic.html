<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Topic · Revise</title>
<style>
:root{--bg:#EEF1EF;--card:#fff;--ink:#17302D;--mute:#667A77;--line:#D9E0DD;--acc:#0F766E;--rec:#E5484D;--r:14px}
:root[data-theme=dark]{--bg:#0E1514;--card:#16201F;--ink:#E4EEEC;--mute:#8CA19E;--line:#263433;--acc:#2DD4BF;--rec:#FF6369}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:0 env(safe-area-inset-right) 40px env(safe-area-inset-left)}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .back{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
.sp{flex:1}
#syncb{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink);white-space:nowrap}
#syncb.ok{color:var(--acc)}#syncb.err{color:var(--rec)}
main{max-width:620px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{color:#fff;border:0;text-align:center;background:var(--c,#64748B);padding:22px 16px;transition:background .3s}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em;overflow-wrap:anywhere;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.hero.lite{color:#0B1F1C}.hero.lite h1,.hero.lite p{text-shadow:none}
.hero p{margin:4px 0 0;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.25)}
h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{font:inherit;color:inherit;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600;width:100%;padding:12px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--rec);font-size:13px;min-height:18px;margin-top:6px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.log{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card));border-radius:8px;margin-bottom:6px}
.log small{color:var(--mute);display:block}
.log button{padding:2px 9px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}.row>button{flex:none}
.danger{color:var(--rec);width:100%}
textarea{font:inherit;color:inherit;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;resize:vertical;min-height:70px}
textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.qs{margin:14px 0 0;padding-left:26px}
.qs li{padding:8px 0;border-bottom:1px solid var(--line)}
.qs li:last-child{border-bottom:0}
.qs .qt{white-space:pre-wrap;overflow-wrap:anywhere}
.qs .qb{display:flex;gap:8px;margin-top:6px}
.qs .qb button{padding:3px 10px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <a class="back" href="./">&larr; Revise</a>
  <span class="sp"></span>
  <a id="syncb" href="#sync">Sync</a>
</header>
<main id="main"><p class="note" id="load">Loading...</p></main>

<script src="revise.js?v=5"></script>
<script>
const tid=new URLSearchParams(location.search).get('t')||'';
let T=null,L=[],Q=[],synced=false,built=false;

function build(){
  $('#main').innerHTML=`
  <section class="card hero" id="hero"><h1 id="hN"></h1><p id="hS"></p><p id="hB" style="font-size:13px"></p></section>
  <button class="pri" id="now" style="margin-top:0">&#10003; Done 20 questions (mark revised now)</button>
  <section class="card">
    <label for="tIn" style="margin-top:0;font-weight:600;color:var(--ink)">Total questions in this topic</label>
    <input id="tIn" type="number" inputmode="numeric" min="0" step="1" style="font-size:20px;font-weight:700">
    <div class="err" id="err" role="alert"></div>
    <p class="note" style="margin:0">Saves as you type. Completion % = sum of current set values &divide; this total (each tap = a set of 20, worth 20 today, losing 1 per day).</p>
  </section>
  <section class="card">
    <h3>Topic settings</h3>
    <label for="nIn" style="margin-top:0">Topic name</label><input id="nIn" maxlength="80">
  </section>
  <section class="card">
    <h3>Unsolved questions <span class="note" id="qc"></span></h3>
    <textarea id="qIn" placeholder="Type a question you could not solve..." aria-label="Unsolved question text"></textarea>
    <button class="pri" id="qAdd" style="margin-top:10px">Add to list</button>
    <ol class="qs" id="qList"></ol>
  </section>
  <section class="card">
    <h3>Add an earlier revision</h3>
    <div class="row"><input id="pd" type="date" aria-label="Date you revised"><button id="pAdd">Add</button></div>
    <p class="note" style="margin:8px 0 0">Forgot to tap on the day? Log it here. Each entry counts as a set of 20 questions.</p>
  </section>
  <section class="card"><h3>History <span class="note" id="hc"></span></h3><div id="hist"></div></section>
  <button class="danger" id="delT">Delete this topic</button>`;
  built=true;
  $('#pd').value=ymd(new Date());$('#pd').max=ymd(new Date());
  $('#now').onclick=()=>{RV.put({id:RV.uid(),k:'r',t:tid,ts:Date.now()}).then(load)};
  const addQ=()=>{const v=$('#qIn').value.trim();if(!v){$('#qIn').focus();return}
    $('#qIn').value='';RV.put({id:RV.uid(),k:'q',t:tid,text:v.slice(0,2000),c:Date.now()}).then(load)};
  $('#qAdd').onclick=addQ;
  $('#qIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addQ()}});
  $('#qList').addEventListener('click',e=>{
    const b=e.target.closest('button[data-q]');if(!b)return;
    const q=Q.find(x=>x.id===b.dataset.q);if(!q)return;
    if(b.dataset.a==='ed'){const v=prompt('Edit question',q.text);if(v&&v.trim())RV.put({...q,text:v.trim().slice(0,2000)}).then(load)}
    else if(confirm('Remove this question from the list (solved or no longer needed)?'))RV.del(q.id).then(load);
  });
  $('#pAdd').onclick=()=>{
    const v=$('#pd').value;if(!v)return;
    const d=parseD(v);d.setHours(12,0,0,0);                       // noon of that day
    const ts=ymd(d)===ymd(new Date())?Date.now():d.getTime();
    RV.put({id:RV.uid(),k:'r',t:tid,ts}).then(load);
  };
  $('#delT').onclick=async()=>{
    if(!confirm('Delete "'+T.name+'" and its whole history?'))return;
    await RV.del([tid,...L.filter(l=>l.t===tid).map(l=>l.id),...Q.filter(q=>q.t===tid).map(q=>q.id)]);location.href="./";
  };
  $('#hist').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');
    if(b&&confirm('Remove this revision from the history?'))RV.del(b.dataset.d).then(load)});
  /* settings save when you leave the field */
  $('#nIn').onchange=()=>{const n=$('#nIn').value.trim();if(!n){$('#nIn').value=T.name;return}RV.put({...T,name:n}).then(load)};
  let tt=null;
  const saveTotal=()=>{
    const n=parseInt($('#tIn').value,10);
    if(!(n>=0)){$('#err').textContent='Enter 0 or a positive number of questions.';return}
    $('#err').textContent='';
    if(n!==(T.n||0))RV.put({...T,n}).then(load);
  };
  $('#tIn').oninput=()=>{clearTimeout(tt);tt=setTimeout(saveTotal,500)};
  $('#tIn').onchange=()=>{clearTimeout(tt);saveTotal()};
}

function render(){
  if(!T){
    $('#main').innerHTML=synced?`<section class="card"><h3>Topic not found</h3><p class="note">It may have been deleted on another device.</p><a href="./">Back to all topics</a></section>`:`<p class="note" id="load">Loading...</p>`;
    built=false;return;
  }
  if(!built)build();
  const last=lastOf(L,T.id),s=scoreOf(T,L);
  document.title=T.name+' · Revise';
  $('#hero').style.setProperty('--c',colourOf(s.S));$('#hero').classList.toggle('lite',s.S>75);
  $('#hB').textContent='Score '+s.S+' · Recency '+Math.round(s.R)+' · Completion '+s.pct+'% · '+(T.n||0)+' questions';
  $('#hN').textContent=T.name;
  $('#hS').textContent=last?'Last revised: '+s.label+' ('+new Date(last).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+')':'Not revised yet';
  const act=document.activeElement;
  if(act!==$('#tIn'))$('#tIn').value=T.n||0;
  if(act!==$('#nIn'))$('#nIn').value=T.name;
  const qs=Q.filter(q=>q.t===T.id);
  $('#qc').textContent='· '+qs.length+' unsolved';
  $('#qList').innerHTML=qs.map(q=>`<li><div class="qt">${esc(q.text)}</div><div class="qb"><button type="button" data-a="ed" data-q="${esc(q.id)}">Edit</button><button type="button" data-a="rm" data-q="${esc(q.id)}">Solved &#10003;</button></div></li>`).join('');
  const mine=L.filter(l=>l.t===T.id);
  $('#hc').textContent='· '+mine.length+' revision'+(mine.length===1?'':'s');
  $('#hist').innerHTML=mine.length?mine.map(l=>{const d=new Date(l.ts);
    return `<div class="log"><div>${esc(d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}))}<small>${esc(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))} · ${daysSince(l.ts)===0?'today':daysSince(l.ts)+' days ago'}</small></div><button data-d="${esc(l.id)}" aria-label="Remove this revision">×</button></div>`}).join(''):'<p class="note">No revisions logged yet.</p>';
}
async function load(){const d=await RV.all();T=d.topics.find(t=>t.id===tid)||null;L=d.logs;Q=d.questions;render()}

RV.on(load);bindSyncButton();
RV.onStatus(s=>{if((s==='ok'||s==='ro'||s==='err')&&!synced){synced=true;if(!T)render()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
RV.open().then(async()=>{await load();RV.start(5000)});
</script>
</body>
</html>
